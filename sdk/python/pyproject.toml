[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-protect"
version = "0.1.0"
description = "Reliability and autonomous recovery substrate for Python AI agents (LangGraph, CrewAI, AutoGen)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "ModusFlow Team", email = "founders@modusflow.com" }]
keywords = ["ai-agents", "reliability", "langgraph", "tool-calls", "recovery", "invariants"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/modusflow/omega"
Repository = "https://github.com/modusflow/omega"
